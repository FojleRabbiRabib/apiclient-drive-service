name: Sync Drive service from upstream

on:
  schedule:
    # Monday ~14:17 UTC — upstream tags weekly on Mondays; this gives a buffer.
    - cron: '17 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-sync-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-sync-

      - name: Fetch Drive-only slice and run guards
        id: fetch
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(./tools/sync-from-upstream.sh | tail -n1)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/ LICENSE; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if nothing changed
        if: steps.diff.outputs.changed == 'false'
        run: echo "No Drive-relevant changes this run."

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Tests + 95% coverage gate on synced code
        if: steps.diff.outputs.changed == 'true'
        run: |
          vendor/bin/phpunit
          php tools/coverage-check.php build/clover.xml 95

      - name: Commit synced snapshot to a branch
        if: steps.diff.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          git config user.name "drive-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="sync/upstream-${UPSTREAM_SHA:0:7}"
          git checkout -b "$BRANCH"
          git add src/ LICENSE
          git commit -m "sync(drive): upstream $UPSTREAM_SHA"

      # Dry-run: this always opens (or updates) a PR for manual review. It never
      # auto-tags or publishes. BC checking is intentionally NOT automated here
      # — Roave could not resolve the google/apiclient base classes (suggest-only
      # + conflict), so it emitted only spurious breaks. Review the diff instead.
      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          BRANCH="sync/upstream-${UPSTREAM_SHA:0:7}"
          {
            echo "Automated weekly sync of the Drive service from \`googleapis/google-api-php-client-services\`."
            echo ""
            echo "- Upstream commit: \`$UPSTREAM_SHA\`"
            echo ""
            echo "This is a **dry-run** workflow — it opens a PR for review and never auto-tags or publishes. Merge to update \`main\`. Review the diff for any breaking API surface (removed/renamed classes, methods, properties, or signature changes) before merging."
          } > pr-body.md
          git push origin HEAD:"$BRANCH"
          gh label create sync --if-not-exists 2>/dev/null || true
          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file pr-body.md
            echo "Updated existing PR for $BRANCH."
          else
            gh pr create --title "sync(drive): weekly upstream sync $(date -u +%Y-%m-%d)" \
              --body-file pr-body.md --base main --label sync
          fi
