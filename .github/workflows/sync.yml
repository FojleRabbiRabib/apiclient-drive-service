name: Sync Drive service from upstream

on:
  schedule:
    # Monday ~14:17 UTC — upstream tags weekly on Mondays; this gives a buffer.
    - cron: '17 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the BC check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-sync-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-sync-

      - name: Fetch Drive-only slice and run guards
        id: fetch
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(./tools/sync-from-upstream.sh | tail -n1)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/ LICENSE; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if nothing changed
        if: steps.diff.outputs.changed == 'false'
        run: echo "No Drive-relevant changes this run."

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Tests + 95% coverage gate on synced code
        if: steps.diff.outputs.changed == 'true'
        run: |
          vendor/bin/phpunit
          php tools/coverage-check.php build/clover.xml 95

      - name: Commit synced snapshot to a branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "drive-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="sync/upstream-${{ steps.fetch.outputs.upstream_sha }}"
          git checkout -b "$BRANCH"
          git add src/ LICENSE
          git commit -m "sync(drive): upstream ${{ steps.fetch.outputs.upstream_sha }}"

      # Best-effort: Roave could not be verified locally (environment quirks
      # during its internal clone). It is non-blocking — the PR opens either
      # way, and the reviewer can diff manually. The tests + coverage gate
      # above is the hard safety net.
      - name: Backward-compatibility check (synced vs current main)
        if: steps.diff.outputs.changed == 'true'
        id: bc
        continue-on-error: true
        run: |
          set +e
          vendor/bin/roave-backward-compatibility-check --from=origin/main --to=HEAD | tee bc-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open PR (dry-run — never auto-publishes or tags)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          BC_EXIT: ${{ steps.bc.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$BC_EXIT" = "0" ]; then
            BC_STATUS="No breaking changes detected by Roave."
          else
            BC_STATUS="**Roave reported breaking changes or could not run — review the diff before merging.**"
          fi
          {
            echo "Automated weekly sync of the Drive service from \`googleapis/google-api-php-client-services\`."
            echo ""
            echo "- Upstream commit: \`$UPSTREAM_SHA\`"
            echo "- Backward-compatibility: $BC_STATUS"
            echo ""
            echo "This is a **dry-run** workflow — it opens a PR for review and never auto-tags or publishes. Merge to update \`main\`."
            echo ""
            echo "<details><summary>Roave backward-compatibility report</summary>"
            echo ""
            echo '```'
            cat bc-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            echo ""
            echo "</details>"
          } > pr-body.md
          BRANCH="sync/upstream-${UPSTREAM_SHA:0:7}"
          git push origin HEAD:"$BRANCH"
          gh pr create --title "sync(drive): weekly upstream sync $(date -u +%Y-%m-%d)" \
            --body-file pr-body.md --base main --label sync || \
            echo "PR may already exist for $BRANCH; branch was updated."
